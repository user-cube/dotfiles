# tmux — used as "tabs + sessions" inside Ghostty (Ghostty's native tabs fight
# AeroSpace). Ghostty's ⌘ shortcuts send these prefix keys, see ghostty/config.
# Prefix stays C-b.

# Terminal / colours
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB"
set -sg escape-time 10
set -g focus-events on

# Behaviour
set -g mouse on                 # wheel scrolls tmux history, click selects pane/tab
set -g history-limit 50000
set -g base-index 1             # tabs numbered from 1 (matches ⌘1…⌘9)
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off     # killing the current session switches to another instead of closing Ghostty
setw -g mode-keys vi
set -g set-clipboard on         # OSC 52 → macOS clipboard via Ghostty
set -g set-titles on
set -g set-titles-string "#S · #W"

# Mouse drag copies to the macOS clipboard (hold ⇧ to use Ghostty's own selection)
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ⌘A: select the whole pane history; y / enter copy to the clipboard, q / esc cancel
bind a copy-mode \; send -X history-top \; send -X start-of-line \; send -X begin-selection \; send -X history-bottom \; send -X end-of-line
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# New tabs/splits open in the current directory
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind X kill-pane                # ⌘W: close pane (the tab, if it was the last one)
# ⌘O: fuzzy-pick a repo under ~/work and open/switch to its session
bind f display-popup -E -w 70% -h 60% "~/.config/tmux/sessionizer.sh"
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# Status bar — Monokai, tabs at the bottom like a tab bar
set -g status-position bottom
set -g status-style "bg=#272822,fg=#f8f8f2"
set -g status-left "#[bg=#a6e22e,fg=#272822,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#75715e]⌘O repo · ⌘⇧S sessions "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bg=#3e3d32,fg=#a6e22e,bold] #I #W "
set -g pane-border-style "fg=#3e3d32"
set -g pane-active-border-style "fg=#a6e22e"
set -g message-style "bg=#3e3d32,fg=#f8f8f2"
set -g popup-style "bg=#272822,fg=#f8f8f2"       # popups (⌘O, ⌘G) in the Monokai background, not tmux's grey
set -g popup-border-style "fg=#a6e22e"
set -g popup-border-lines rounded

# Pane navigation for ⌘⌥ arrows (Ghostty sends prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ⌘G: lazygit for the current pane's repo, in a popup
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# Sessions survive reboots: tmux-resurrect + tmux-continuum, cloned into
# ./plugins at pinned commits by the playbook (devops-daily-driver, `tmux_plugins`;
# no TPM). continuum saves every
# 15 min; ghostty/tmux-start.sh restores the last save when tmux starts from
# scratch. Manual: prefix C-s saves, prefix C-r restores.
# Must stay at the end: continuum hooks into status-right.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '15'
run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.config/tmux/plugins/tmux-continuum/continuum.tmux
