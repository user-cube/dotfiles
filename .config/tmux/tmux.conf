# tmux — used as "tabs + sessions" inside Ghostty (Ghostty's native tabs fight
# AeroSpace). Ghostty's ⌘ shortcuts send these prefix keys, see ghostty/config.
# Prefix stays C-b.

# Terminal / colours
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB"
# Shift+Enter and other modified keys reach apps that ask for them (Claude Code
# newline, nvim ctrl/alt combos); Ghostty supports the extended format. VS Code
# doesn't: its Shift+Enter is ESC + Enter instead (vscode/keybindings.json)
set -s extended-keys on
set -as terminal-features "xterm-ghostty:extkeys"
set -as terminal-features "xterm-ghostty:hyperlinks"   # OSC 8 links (gh, ls --hyperlink, delta) reach Ghostty
# VS Code's terminal (vscode/tmux.sh) says xterm-256color: true colour and links too
set -ga terminal-overrides ",xterm-256color:RGB"
set -as terminal-features "xterm-256color:hyperlinks"
# Let apps talk to Ghostty directly through tmux (yazi image previews)
set -g allow-passthrough on
set -sg escape-time 10
set -g focus-events on

# Behaviour
set -g mouse on                 # wheel scrolls tmux history, click selects pane/tab
set -g history-limit 50000
set -g base-index 1             # tabs numbered from 1 (matches ⌘1…⌘9)
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off     # killing the current session switches to another instead of closing Ghostty
setw -g mode-keys vi
set -g set-clipboard on         # OSC 52 → macOS clipboard via Ghostty
set -g set-titles on
set -g set-titles-string "#S · #W"

# Mouse drag copies to the macOS clipboard (hold ⇧ to use Ghostty's own selection).
# Stays in copy mode where it was scrolled to, the copied text still highlighted:
# a click clears it, another drag selects more, q / esc go back to the prompt.
# (-and-cancel jumped to the bottom on release, losing the place in the history.)
# Double click copies a word, triple click a line, the same way.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "pbcopy"
bind -T copy-mode-vi MouseDown1Pane    select-pane \; send -X clear-selection
bind -T copy-mode-vi DoubleClick1Pane  select-pane \; send -X select-word \; send -X copy-pipe-no-clear "pbcopy"
bind -T copy-mode-vi TripleClick1Pane  select-pane \; send -X select-line \; send -X copy-pipe-no-clear "pbcopy"
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear "pbcopy"
bind -T copy-mode    MouseDown1Pane    select-pane \; send -X clear-selection

# ⌘A: select the whole pane history; y / enter copy to the clipboard, q / esc cancel
bind a copy-mode \; send -X history-top \; send -X start-of-line \; send -X begin-selection \; send -X history-bottom \; send -X end-of-line
# v starts a selection as in vim (tmux's default is a rectangle toggle, still on C-v)
bind -T copy-mode-vi v     send -X begin-selection \; set -p @kbd-sel 1
bind -T copy-mode-vi Space send -X begin-selection \; set -p @kbd-sel 1
bind -T copy-mode-vi V     send -X select-line \; set -p @kbd-sel 1
# The wheel extends a selection started from the keyboard (v, wheel, y): it moves
# the cursor, and scroll-up/down would stop the selection instead. Mouse drags
# (@kbd-sel unset) keep the plain scroll.
bind -T copy-mode-vi MouseDrag1Pane select-pane \; set -pu @kbd-sel \; send -X begin-selection
bind -T copy-mode-vi WheelUpPane   select-pane \; if -F '#{&&:#{selection_active},#{@kbd-sel}}' { send -X -N 5 cursor-up } { send -X -N 5 scroll-up }
bind -T copy-mode-vi WheelDownPane select-pane \; if -F '#{&&:#{selection_active},#{@kbd-sel}}' { send -X -N 5 cursor-down } { send -X -N 5 scroll-down }
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# Prompt marks (OSC 133, from p10k's shell integration in .p10k.zsh)
# [ / ]: previous / next prompt in copy mode (cursor-up first: from the prompt
# being typed at, the first [ goes to the last command, not to that prompt's top)
bind -T copy-mode-vi [ send -X cursor-up \; send -X previous-prompt
bind -T copy-mode-vi ] send -X next-prompt
# ⌘⇧↑ / ⌘⇧↓: the same from anywhere (Ghostty's own jump_to_prompt keys, which
# can't see through tmux). The first ⌘⇧↑ enters copy mode on the command before
# the last: the last one is plain ⌘⇧C.
bind P if -F '#{pane_in_mode}' {
    send -X cursor-up ; send -X previous-prompt
  } {
    copy-mode ; send -X cursor-up ; send -X previous-prompt ; send -X cursor-up ; send -X previous-prompt
  }
bind N if -F '#{pane_in_mode}' { send -X next-prompt }
# ⌘⇧C: copy a command's output, without its prompt and trailing blank lines: the
# last command's, or in copy mode the one whose prompt the cursor is on ([ / ]).
# A cursor that didn't move found no mark (a shell started before them): says so
# instead of copying the prompt.
bind y if -F '#{pane_in_mode}' {
    set -pF @copy-from '#{scroll_position}:#{copy_cursor_y}:#{copy_cursor_x}'
    send -X next-prompt -o
  } {
    copy-mode
    set -pF @copy-from '#{scroll_position}:#{copy_cursor_y}:#{copy_cursor_x}'
    send -X previous-prompt -o
  } \; \
  if -F '#{==:#{@copy-from},#{scroll_position}:#{copy_cursor_y}:#{copy_cursor_x}}' {
    send -X cancel
    display "⌘⇧C: no command output marked in this pane (exec zsh starts marking them)"
  } {
    send -X begin-selection ; send -X next-prompt ; send -X cursor-up ; send -X end-of-line
    send -X copy-pipe-and-cancel "perl -0pe 's/\\s+\\z//' | pbcopy"
  }

# New tabs/splits open in the current directory
bind c new-window -c "#{pane_current_path}"
# ⌘D / ⌘⇧D: split; a pane in `ssh host` opens the same ssh in the new pane (split.sh)
bind % run-shell "~/.config/tmux/split.sh -h '#{pane_id}' '#{pane_tty}' '#{pane_current_path}'"
bind '"' run-shell "~/.config/tmux/split.sh -v '#{pane_id}' '#{pane_tty}' '#{pane_current_path}'"
bind X kill-pane                # ⌘W: close pane (the tab, if it was the last one)
# ⌘O: fuzzy-pick a repo under ~/work and open/switch to its session
bind f display-popup -E -w 70% -h 60% "~/.config/tmux/sessionizer.sh"
# ⌘⇧O: fuzzy-pick an ssh host and open it in a new tab named after it
bind O display-popup -E -w 60% -h 50% "~/.config/tmux/ssh-picker.sh"
# prefix S (or "manage sessions" in ⌘⇧H): switch / kill / rename / create sessions
bind S display-popup -E -w 60 -h 50% -T ' sessions ' "~/.config/tmux/sessions.sh"
# ⌘⇧R: rename the tab in a small popup instead of the status-line prompt
# (run-shell expands #{…}; display-popup alone passes them through literally.
# || true: Esc cancels with exit 1, which run-shell would show as an error)
bind , run-shell "tmux display-popup -c '#{client_name}' -E -w 40 -h 3 -T ' rename tab ' \"~/.config/tmux/rename-window.sh '#{window_id}'\" || true"
# ⌘⇧H: cheat sheet of every ⌘ shortcut (the status bar only lists the most used)
bind ? run-shell "tmux display-popup -c '#{client_name}' -E -w 62 -h 28 -T ' shortcuts ' \"~/.config/tmux/cheatsheet.sh '#{client_name}'\""
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# Status bar — Monokai, tabs at the bottom like a tab bar
set -g status-position bottom
set -g status-style "bg=#272822,fg=#f8f8f2"
set -g status-left "#[bg=#a6e22e,fg=#272822,bold] #S #[default] "
set -g status-left-length 30
# The #(…continuum_save.sh) is tmux-continuum's autosave. Set here and not only
# by the plugin: the plugin skips it on a reload while the ⌘J scratch server runs
# (it takes that for another tmux server). Same string, so it isn't added twice.
set -g status-right "#($HOME/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#[fg=#75715e]⌘O repo · ⌘G git · ⌘⇧G diff · ⌘E files · ⌘⇧H shortcuts "
set -g status-right-length 80
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bg=#3e3d32,fg=#a6e22e,bold] #I #W "
set -g pane-border-style "fg=#3e3d32"
set -g pane-active-border-style "fg=#a6e22e"
set -g message-style "bg=#3e3d32,fg=#f8f8f2"
set -g popup-style "bg=#272822,fg=#f8f8f2"       # popups (⌘⇧H, ⌘O, ⌘⇧O, ⌘⇧R, ⌘G, ⌘⇧G, ⌘E, ⌘⇧L, ⌘K, ⌘J) in the Monokai background, not tmux's grey
set -g popup-border-style "fg=#a6e22e"
set -g popup-border-lines rounded

# Pane navigation for ⌘⌥ arrows (Ghostty sends prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ⌘G: lazygit for the current pane's repo, in a popup
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
# ⌘⇧G: side-by-side diff of the working tree (lumen); q closes
bind G display-popup -E -w 95% -h 95% -d "#{pane_current_path}" "lumen diff"
# ⌘E: yazi file manager in the current folder; q closes
bind e display-popup -E -w 90% -h 90% -d "#{pane_current_path}" yazi
# ⌘⇧L: lazydocker (containers of the active Colima/Docker context); q closes
bind D display-popup -E -w 95% -h 95% lazydocker
# ⌘K: k9s on the current kube context, read-only on production (kube-guard.zsh,
# which also points it at ~/.config/k9s); :q or ctrl+c closes
bind K display-popup -E -w 95% -h 95% "zsh -c 'source ~/.config/zsh/kube-guard.zsh && k9s'"
# ⌘J: scratch terminal in a popup. It runs on its own tmux server (scratch.conf):
# keeps history and running commands, ⌘J inside closes it, and nothing inside can
# switch sessions or open another popup
bind J display-popup -E -w 80% -h 75% -d "#{pane_current_path}" \
  "TMUX= tmux -L scratch -f ~/.config/tmux/scratch.conf new-session -A -s scratch"

# F12: tmux inside tmux (ssh to a server running tmux). Turns this tmux "off":
# every key, prefix and ⌘ shortcuts included, goes to the inner tmux, and the
# status bar greys out with OFF. F12 again turns it back on.
bind -T root F12 \
  set prefix None \; set key-table off \; \
  set status-style "bg=#1e1f1c,fg=#75715e" \; \
  set status-left "#[bg=#75715e,fg=#272822,bold] OFF #[default] " \; \
  if -F "#{pane_in_mode}" "send-keys -X cancel" \; refresh-client -S
bind -T off F12 \
  set -u prefix \; set -u key-table \; \
  set -u status-style \; set -u status-left \; refresh-client -S

# ⌘Y: tmux-fingers (Homebrew). Letters over every copyable token on screen
# (pod names, git hashes, IPs, paths, URLs); the letter copies it, Shift+letter
# copies and pastes it at the prompt. Jump mode moved off J (⌘J is scratch).
set -g @fingers-key Y
set -g @fingers-jump-key C-y
run 'tmux-fingers load-config'

# ⌘U: tmux-fzf-url (cloned into ./plugins by the playbook). Every URL in the
# pane and its last 2000 lines of history, in fzf; enter opens it in the browser
set -g @fzf-url-bind u
set -g @fzf-url-history-limit 2000
run-shell ~/.config/tmux/plugins/tmux-fzf-url/fzf-url.tmux

# Sessions survive reboots: tmux-resurrect + tmux-continuum, cloned into
# ./plugins at pinned commits by the playbook (devops-daily-driver, `tmux_plugins`;
# no TPM). continuum saves every
# 15 min; tmux/start-server.sh restores the last save when tmux starts from
# scratch. Manual: prefix C-s saves, prefix C-r restores.
# Must stay at the end: continuum hooks into status-right.
set -g @resurrect-capture-pane-contents 'on'
# Sessions VS Code's terminal made and throwaway ones stay out of the save
set -g @resurrect-hook-post-save-layout '~/.config/tmux/resurrect-drop.sh'
set -g @continuum-save-interval '15'
run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.config/tmux/plugins/tmux-continuum/continuum.tmux
