# Config for the ⌘J scratch terminal: a separate tmux server (`tmux -L scratch`)
# shown in a popup of the main one. Kept apart on purpose:
# - Ghostty's ⌘ keys arrive here as prefix + key; only ⌘J (close) is bound, so
#   ⌘O/⌘⇧S/⌘J can't switch sessions or open popups inside the popup
# - no plugins, so it never writes to the main server's tmux-resurrect saves

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB"
set -s extended-keys on
set -as terminal-features "xterm-ghostty:extkeys"
set -sg escape-time 10
set -g history-limit 50000
set -g mouse on
setw -g mode-keys vi
set -g set-clipboard on
set -g status off

unbind -a -T prefix
# ⌘J: close the popup; the shell keeps running for next time
bind J detach-client
# ⌘A: select the whole history; y / enter copy to the clipboard
bind a copy-mode \; send -X history-top \; send -X start-of-line \; send -X begin-selection \; send -X history-bottom \; send -X end-of-line

bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
