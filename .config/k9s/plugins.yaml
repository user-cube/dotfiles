# k9s plugins: a key on the selected resource runs a tool. They show up in the
# header (and ?) of the views in `scopes`.
plugins:
  # Ctrl-L: logs of every pod of a deployment / statefulset / daemonset (or of
  # the pod) together, through stern, newest 100 lines then follow
  stern:
    shortCut: Ctrl-L
    description: Logs (stern)
    scopes: [pods, deployments, statefulsets, daemonsets]
    command: stern
    background: false
    args: [--tail, "100", --context, $CONTEXT, -n, $NAMESPACE, $NAME]

  # Ctrl-N: the resource's YAML without managedFields, status and defaults
  # (kubectl neat, from krew), for copying into a manifest
  neat:
    shortCut: Ctrl-N
    description: YAML (neat)
    scopes: [all]
    command: sh
    background: false
    args:
      - -c
      - kubectl get "$RESOURCE_NAME" "$NAME" -n "$NAMESPACE" --context "$CONTEXT" -o yaml | kubectl neat | less

  # Ctrl-I on a container: its image's layers (dive; pulls through Docker / Colima)
  dive:
    shortCut: Ctrl-I
    description: Image layers (dive)
    scopes: [containers]
    command: dive
    background: false
    args: [$COL-IMAGE]

  # Ctrl-B on a container: a debug container (busybox) next to it, sharing its
  # processes: a shell for images that have none (distroless)
  debug:
    shortCut: Ctrl-B
    description: Debug container
    scopes: [containers]
    command: kubectl
    background: false
    dangerous: true # adds an ephemeral container: off in read-only (production)
    args: [debug, -it, --context, $CONTEXT, -n, $NAMESPACE, $POD, --target, $NAME, --image, "busybox:1.37.0", --profile, general, --, sh]

  # Argo CD applications, through kubectl (no argocd login): the same as the
  # UI's Refresh, Hard refresh and Sync. Off in read-only (production)
  argocd-refresh:
    shortCut: Ctrl-F
    description: Argo refresh
    scopes: [applications]
    command: kubectl
    background: true
    dangerous: true
    args: [annotate, applications, $NAME, -n, $NAMESPACE, --context, $CONTEXT, --overwrite, argocd.argoproj.io/refresh=normal]

  argocd-hard-refresh:
    shortCut: Ctrl-G
    description: Argo hard refresh
    scopes: [applications]
    command: kubectl
    background: true
    dangerous: true
    args: [annotate, applications, $NAME, -n, $NAMESPACE, --context, $CONTEXT, --overwrite, argocd.argoproj.io/refresh=hard]

  argocd-sync:
    shortCut: Ctrl-Y
    description: Argo sync
    scopes: [applications]
    command: kubectl
    background: true
    confirm: true
    dangerous: true
    args: [patch, applications, $NAME, -n, $NAMESPACE, --context, $CONTEXT, --type, merge, -p, '{"operation":{"initiatedBy":{"username":"k9s"},"sync":{"syncStrategy":{"hook":{}}}}}']
