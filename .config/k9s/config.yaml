# k9s (K9S_CONFIG_DIR=~/.config/k9s, set in .config/zsh/kube-guard.zsh). Per
# context state (favorite namespaces, last view) goes in clusters/, per machine.
k9s:
  liveViewAutoRefresh: false
  gpuVendors: {}
  refreshRate: 2
  apiServerTimeout: 2m0s
  maxConnRetry: 5
  readOnly: false
  noExitOnCtrlC: false
  portForwardAddress: localhost
  ui:
    enableMouse: false
    headless: false
    logoless: false
    crumbsless: false
    splashless: false
    reactive: true # rereads the config and skin when they change, no restart
    skin: monokai # skins/monokai.yaml
    noIcons: false
    invert: false
    defaultsToFullScreen: false
    useFullGVRTitle: false
  skipLatestRevCheck: false
  disablePodCounting: false
  shellPod:
    image: busybox:1.37.0
    namespace: default
    limits:
      cpu: 100m
      memory: 100Mi
  imageScans:
    enable: false
    exclusions:
      namespaces: []
      labels: {}
  logger:
    tail: 200 # lines shown when the logs open
    buffer: 5000
    sinceSeconds: -1
    textWrap: true # long lines wrap instead of going off screen
    disableAutoscroll: false
    columnLock: false
    showTime: true # each line's timestamp
  thresholds:
    cpu:
      critical: 90
      warn: 70
    memory:
      critical: 90
      warn: 70
  defaultView: ""
