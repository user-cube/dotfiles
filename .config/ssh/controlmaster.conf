# Included from the top of ~/.ssh/config (the playbook adds the Include line).
# One TCP connection per host, shared by every ssh/scp/git to it: extra tmux
# splits on the same server open at once, with no new login or key approval.
Host *
  ControlMaster auto
  # %C: hash of local host, remote host, port and user (short socket path)
  ControlPath ~/.ssh/cm-%C
  # Keep the shared connection 10 min after the last session closes
  ControlPersist 10m
  # Notice dead connections (sleep, wifi) in ~90 s instead of hanging
  ServerAliveInterval 30
  ServerAliveCountMax 3
