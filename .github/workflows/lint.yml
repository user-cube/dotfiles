name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck + bash 3.2 + zsh and JSON syntax + nvim + go tools + pytest + Hue + gitleaks
    # macOS on purpose: scripts run with /bin/bash 3.2, which only macOS ships
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the whole history

      - name: Install tooling
        run: brew install shellcheck gitleaks go jq neovim tree-sitter-cli tmux bat opentofu fzf

      - name: List shell scripts
        run: git ls-files -z | xargs -0 grep -lIE '^#!.*\b(ba)?sh\b' > "$RUNNER_TEMP/scripts.txt"

      # Catches syntax that only newer bash accepts (e.g. `case` inside `$( )`)
      - name: bash 3.2 syntax
        run: |
          rc=0
          while read -r f; do /bin/bash -n "$f" || rc=1; done < "$RUNNER_TEMP/scripts.txt"
          exit $rc

      - name: shellcheck
        run: xargs shellcheck -x -S warning < "$RUNNER_TEMP/scripts.txt"

      # Unquoted variables too (an info-level check): a value with a space or a *
      # would split or glob. Where splitting is wanted, use an array
      - name: shellcheck (quoting)
        run: xargs shellcheck -x -S info -i SC2086 < "$RUNNER_TEMP/scripts.txt"

      - name: zsh syntax
        run: |
          rc=0
          for f in .zshrc .config/zsh/*.zsh; do zsh -n "$f" || rc=1; done
          exit $rc

      # A broken claude/settings.json breaks Claude Code; a broken template, `ws -t`
      - name: JSON syntax
        run: |
          rc=0
          while IFS= read -r -d '' f; do jq empty "$f" || { echo "invalid JSON: $f"; rc=1; }; done < <(git ls-files -z '*.json')
          exit $rc

      # The nvim config starts clean with the plugins at lazy-lock.json. nvim exits
      # 0 even on a Lua error, so any output on startup fails the step
      - name: nvim starts without errors
        run: |
          export XDG_CONFIG_HOME="$PWD/.config" XDG_DATA_HOME="$RUNNER_TEMP/nvim/data" \
            XDG_STATE_HOME="$RUNNER_TEMP/nvim/state" XDG_CACHE_HOME="$RUNNER_TEMP/nvim/cache"
          nvim --headless "+Lazy! restore" +qa
          out=$(nvim --headless +qa 2>&1)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      # tests/: the shortcuts in Ghostty, tmux and the cheat sheet agree, k9s keys
      # and plugins, every config parses, and the behaviour of kube-guard, the
      # tofu fmt hook, the krew completions and plugins-outdated (fake commands);
      # ↑ / Ctrl+R read the other shells' history (fzf)
      - name: pytest
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q -r tests/requirements.txt
          "$RUNNER_TEMP/venv/bin/pytest" tests/ -q

      # Hue's colors, danger places and colorCustomizations, and extension.js
      # with a fake vscode (node ships with the runner)
      # The file, not the folder: Node 24 runs a folder given to --test as a
      # module (its package.json main, extension.js, which needs VS Code)
      - name: Hue extension (node --test)
        run: node --test .config/vscode/extensions/hue/colors.test.js

      # Every work commit runs this hook: a broken build blocks them all
      - name: commit-msg hook (go vet + test)
        working-directory: git_hooks/go/commit-msg
        run: go vet ./... && go test ./...

      - name: local-files (go vet + test)
        working-directory: .config/dotfiles/local-files
        run: go vet ./... && go test ./...

      - name: sketchybar check (go vet + test)
        working-directory: .config/sketchybar/plugins/check
        run: go vet ./... && go test ./...

      # Claude Code's PreToolUse hook: blocks reads of cleartext credentials
      - name: deny-sensitive-reads hook (go vet + test)
        working-directory: claude/hooks/deny-sensitive-reads
        run: go vet ./... && go test ./...

      # dotfiles-sync into an empty fake HOME: the install path end to end
      # (copies, Go builds, icon map, Hue, obsolete files, a second run that does nothing)
      - name: install (dotfiles-sync in a fake HOME)
        run: .github/scripts/test-install.sh

      - name: gitleaks
        run: gitleaks git --redact --no-banner .
